version: 2
models:
  - name: order_details
    description: "A model to aggregate order details from raw_orders and raw_customers."
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: customer_name
      - name: order_date
      - name: status
      - name: amount_dollars
