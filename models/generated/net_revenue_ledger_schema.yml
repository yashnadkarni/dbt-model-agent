version: 2
models:
  - name: net_revenue_ledger
    description: "A ledger of net revenue after filtering out transactions with zero gross revenue."
    columns:
      - name: transaction_id
        tests:
          - not_null
          - unique
      - name: gross_revenue
        tests:
          - not_null
      - name: tax_amount
        tests:
          - not_null
      - name: net_revenue
        tests:
          - not_null
