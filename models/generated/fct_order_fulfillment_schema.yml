version: 2
models:
  - name: fct_order_fulfillment
    description: "Fact table for order fulfillment"
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: order_date
        tests:
          - not_null
      - name: promised_delivery_date
        tests:
          - not_null
      - name: cleaned_ship_date
        tests:
          - not_null
      - name: is_delayed
        tests:
          - not_null
